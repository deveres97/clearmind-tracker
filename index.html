<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<title>ClearMind</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./img/icon-192.png">
<link rel="apple-touch-icon" href="./img/apple-touch-icon.png">

<style>
:root{--bg:#101015;--panel:#18181F;--panel2:#1F1F28;--line:#2A2A35;--text:#F1F0E1;--muted:#9C9B90;--slate:#506385;--mist:#8EA0C2;
 --sage:#8FA58A;--sageInk:#8FA58A;--ember:#C9925E;--emberInk:#C9925E;--clay:#B5776E;--field:#14141A;--tint:.10;color-scheme:dark;
 --green:var(--sageInk);--green2:var(--sage);--amber:var(--emberInk);--red:var(--clay);--white:var(--text);
 --mono:'DM Mono',ui-monospace,'SF Mono',Menlo,monospace;--sans:'Instrument Sans',system-ui,-apple-system,Roboto,sans-serif}
:root[data-theme=light]{--bg:#F1F0E1;--panel:#F8F7EC;--panel2:#EAE8D6;--line:#D6D3BF;--text:#101015;--muted:#64635A;--mist:#506385;
 --sage:#7E9779;--sageInk:#4F6B4B;--ember:#C9925E;--emberInk:#8A5526;--clay:#B5776E;--field:#FFFEF6;--tint:.16;color-scheme:light}
@media (prefers-color-scheme:light){:root:not([data-theme]){--bg:#F1F0E1;--panel:#F8F7EC;--panel2:#EAE8D6;--line:#D6D3BF;--text:#101015;--muted:#64635A;--mist:#506385;
 --sage:#7E9779;--sageInk:#4F6B4B;--ember:#C9925E;--emberInk:#8A5526;--clay:#B5776E;--field:#FFFEF6;--tint:.16;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
main{max-width:600px;margin:auto;padding:14px 16px 112px}
h1{font:500 20px var(--mono);margin:0;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
h1 .ic{color:var(--sage)}
h2{font:500 15px/1.35 var(--mono);margin:0 0 10px;letter-spacing:-.01em}
h3{font:500 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;margin:20px 0 8px;color:var(--muted)}
p{margin:6px 0;color:var(--muted)}
a{color:var(--mist)}
.small{font-size:12.5px;color:var(--muted)}
.white{color:var(--text)}
.label{font:500 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em;flex:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel2);border-radius:14px;padding:12px 13px;min-width:0}
.stat b{display:block;font:300 22px var(--mono);margin-top:4px;overflow-wrap:anywhere;letter-spacing:-.02em}
.stat>.small:first-child{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase}
button{font:500 13.5px var(--mono);letter-spacing:-.01em;border:0;border-radius:999px;padding:13px 18px;background:var(--text);color:var(--bg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button.amber{background:var(--ember);color:#101015}
button.danger{background:transparent;color:var(--clay);border:1px solid var(--clay)}
button.sm{padding:8px 13px;font-size:12px}
button.link{background:none;color:var(--mist);padding:6px 8px;border-radius:8px}
button:active{transform:scale(.98)}
button:disabled{opacity:.4}
button:focus-visible,input:focus,select:focus,textarea:focus{outline:2px solid var(--slate);outline-offset:2px}
button.wide{width:100%}
.mt{margin-top:10px}
.big{flex-direction:column;gap:8px;padding:16px 6px;border-radius:16px;font-size:12px}
.big span{font-size:24px;line-height:1}
.sosbtn{width:100%;padding:20px;border-radius:20px;background:var(--ember);color:#101015;margin:4px 0 6px;flex-direction:column;gap:4px;font-size:17px}
.sosbtn small{font:400 12.5px var(--sans);opacity:.75}
.hero{text-align:center;padding:24px 18px}
.heroT{font:300 52px/1.05 var(--mono);letter-spacing:-.04em;margin:6px 0;font-variant-numeric:tabular-nums}
.bignum{margin:8px 0}.bignum b{font:300 34px var(--mono);letter-spacing:-.03em}.bignum span{color:var(--muted);font-family:var(--mono)}
.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;background:var(--sage);border-radius:3px;transition:width .4s}
.bar.over i{background:var(--ember)}
.pill{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);padding:5px 9px;border-radius:999px;color:var(--muted);white-space:nowrap}
.notice{background:color-mix(in srgb,var(--ember) calc(var(--tint)*100%),var(--panel));border:1px solid color-mix(in srgb,var(--ember) 35%,var(--line));color:var(--text);border-radius:16px;padding:14px;margin:10px 0;font-size:14px}
.notice b{color:var(--emberInk);font-family:var(--mono);font-weight:500}
.notice.good{background:color-mix(in srgb,var(--sage) calc(var(--tint)*100%),var(--panel));border-color:color-mix(in srgb,var(--sage) 35%,var(--line))}
.notice.good b{color:var(--sageInk)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:400 12.5px var(--mono);background:transparent;border:1px solid var(--line);color:var(--text);padding:9px 13px;border-radius:999px}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.scale .chip{padding:12px 0;border-radius:10px;text-align:center;justify-content:center}
.emo{display:grid;grid-template-columns:64px repeat(5,1fr);gap:5px;align-items:center;margin:6px 0}
.emo .chip{padding:9px 0;border-radius:10px}
label{display:block;font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 0 7px}
label.check{text-transform:none;letter-spacing:0;font:400 14px var(--sans);color:var(--text);display:flex;align-items:center}
input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--text);font:15px var(--sans)}
input[type=checkbox]{width:auto;margin-right:10px;accent-color:var(--slate);transform:scale(1.15)}
.stepper{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:999px;padding:4px}
.stepper button{width:48px;height:44px;font-size:20px;padding:0}
.stepper b{font:400 16px var(--mono)}
.view{display:none}.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav .in{display:flex;max-width:600px;width:100%}
nav button{flex:1;background:none;color:var(--muted);font:500 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:8px 2px;flex-direction:column;gap:5px;border-radius:12px}
nav button i{font-style:normal;font-size:21px;line-height:1;display:flex}
nav button.on{color:var(--text)}
nav button.on i{color:var(--text)}
nav button.sos{color:var(--emberInk)}
.sheetwrap{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheetwrap[hidden]{display:none}
.sheet{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;width:100%;max-width:600px;max-height:92vh;overflow:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease}
.sheet::before{content:'';display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,30px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);border-radius:999px;padding:10px 16px;display:flex;gap:10px;align-items:center;transition:.25s;z-index:30;max-width:92vw;font:400 13px var(--mono)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast .link{color:var(--bg);text-decoration:underline;padding:2px 4px}
.chart{display:flex;align-items:flex-end;gap:5px;height:130px;margin-top:12px}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.col .v{width:100%;border-radius:4px 4px 1px 1px;background:var(--sage);min-height:2px}
.col .v.over{background:var(--ember)}
.col .v.zero{background:var(--line)}
.col .n{font:10px var(--mono);color:var(--muted);margin-bottom:3px}
.col .cap{position:absolute;left:-2px;right:-2px;border-top:1px dashed var(--muted)}
.lbls{display:flex;gap:5px;margin-top:6px}.lbls span{flex:1;text-align:center;font:10px var(--mono);color:var(--muted)}
.hb{display:grid;grid-template-columns:118px 1fr 36px;gap:10px;align-items:center;font:12.5px var(--mono);margin:8px 0}
.hb .t{height:3px;background:var(--line);border-radius:3px;overflow:hidden}.hb .t i{display:block;height:100%;background:var(--sage)}
.entry{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry>div>div:first-child{font-family:var(--mono);font-size:13.5px}
.dayhead{font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 2px}
.breath{width:180px;height:180px;border-radius:50%;margin:16px auto;background:color-mix(in srgb,var(--sage) 14%,transparent);border:1px solid var(--sage);display:flex;align-items:center;justify-content:center;font:400 14px/1.5 var(--mono);text-align:center;transform:scale(.62);white-space:pre-line}
ul.tidy{margin:6px 0;padding-left:18px;color:var(--muted)}ul.tidy li{margin:7px 0}
.tel{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.tel:last-child{border-bottom:0}
.tel a{font-family:var(--mono)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{background:var(--panel2);border:1px solid transparent;color:var(--text);text-align:left;padding:16px 14px;border-radius:16px;font:500 14px var(--mono);flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:6px;min-height:108px}
.tool span{font-size:22px;color:var(--mist);margin-bottom:4px}.tool small{font:400 12px var(--sans);color:var(--muted)}
.flip{border:1px solid var(--line);border-radius:14px;padding:14px;margin:8px 0;cursor:pointer}
.flip .q{font:500 14px var(--mono);color:var(--emberInk)}
.flip .a{margin-top:8px;color:var(--text)}
.ms{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ms:last-child{border-bottom:0}
.ms .dot{width:24px;height:24px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font:11px var(--mono);border:1px solid var(--line);color:var(--muted)}
.ms .tt{font-family:var(--mono);font-weight:500}
.ms.got .dot{background:var(--sage);color:#101015;border-color:var(--sage)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{border:1px solid var(--line);border-radius:14px;padding:14px 6px 10px;text-align:center;font:11px/1.35 var(--mono);color:var(--muted)}
.badge span{display:block;font-size:24px;margin-bottom:6px;opacity:.35}
.badge.got{color:var(--text);background:var(--panel2);border-color:transparent}.badge.got span{color:var(--sageInk);opacity:1}
.lvl{display:flex;gap:14px;align-items:center}
.lvl .e{font-size:30px;color:var(--sageInk);width:56px;height:56px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center}
.lvl b{font-family:var(--mono);font-weight:500}
.wave{width:100%;height:110px;display:block}
.board{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;background:var(--panel2);padding:6px;border-radius:14px;touch-action:manipulation;user-select:none}
.board div{aspect-ratio:1;border-radius:4px;background:var(--bg)}
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.slot{border:1px solid var(--line);border-radius:14px;min-height:84px;display:flex;align-items:center;justify-content:center;padding:6px}
.slot.sel{border-color:var(--ember);background:color-mix(in srgb,var(--ember) 10%,transparent)}
.mini{display:grid;gap:2px}.mini div{width:13px;height:13px;border-radius:3px}
.steps{display:flex;gap:6px;margin-bottom:14px}.steps i{flex:1;height:3px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--ember)}

.artbox{background:#101015;border-radius:16px;display:flex;align-items:center;justify-content:center;padding:18px;margin:-4px -4px 14px}
.artbox img{max-width:100%;max-height:200px;display:block}
.art-wave{width:100%;border-radius:16px;display:block;margin:0 0 14px}
.tb-badge{width:52px;height:52px;flex:none;border-radius:50%;background:#101015;padding:4px}
#lvlChip{font-size:11px;letter-spacing:.08em;padding:8px 12px}
footer{font-size:12px;color:var(--muted);line-height:1.6;margin:18px 4px}

main{padding:14px 16px 40px}
#hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;min-height:42px}
.ring{position:relative;width:min(270px,78vw);aspect-ratio:1;margin:10px auto 18px}
.ring svg{width:100%;height:100%;display:block}
.ringIn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.ringIn .heroT{font-size:40px;margin:2px 0}
#toast{bottom:28px}
.chip{display:inline-flex;align-items:center;gap:6px}
</style>
</head>

let subTick=null;

  const c=h('div',{class:'breath',textContent:''});box.append(c);let ph='';
  subTick=()=>{if(!c.isConnected){return}
    const e=(Date.now()-breath.t0)%14000;let p,lab,left;
    if(e<4000){p='in';lab='Breathe in';left=4000-e}else if(e<8000){p='hold';lab='Hold';left=8000-e}else{p='out';lab='Breathe out';left=14000-e}
    if(p!==ph){ph=p;if(p==='in'){c.style.transition='transform 4s ease-in-out';c.style.transform='scale(1)'}if(p==='out'){c.style.transition='transform 6s ease-in-out';c.style.transform='scale(.62)'}}
    c.textContent=`${lab}\n${Math.ceil(left/1000)}`};
}
function rWon(){
  const n=S.wins.length;
  fill($('app'),h('div',{class:'card hero'},h('img',{class:'art-wave',src:'img/art-wave.png',alt:''}),
    h('h2',{style:'font-size:22px',textContent:'You rode it out.'}),
    h('p',{class:'white',style:'font-size:16px',textContent:n===1?'First craving beaten. Now you know it can be done.':`That’s ${n} cravings beaten. Each one makes the next one weaker.`}),
    digits()?h('button',{class:'ghost wide mt',onclick:()=>native.whatsapp(digits(),`Just beat a craving. Day ${tbDay()} of ${S.tb.days}.`)},ic('send'),`Tell ${who()}`):null,
    h('button',{class:'wide mt',textContent:'Back home',onclick:()=>go('home')})));
}
function rSmoke(){
  fill($('app'),card(h('h2',{style:'font-size:19px',textContent:'Okay. Your call.'}),
    h('p',{textContent:'You gave it a real try, and that still counts. If you’re going to, make it as small as you can:'}),
    h('ul',{class:'tidy white'},['No tobacco in it','The smallest amount you can','One, then put everything away again'].map(x=>h('li',{textContent:x}))),
    h('p',{textContent:'Then come back and tap "I slipped". A slip doesn’t end the break. Disappearing does.'}),
    h('button',{class:'wide mt',textContent:'Actually, give me 10 more minutes',onclick:startCrave}),
    h('button',{class:'ghost wide mt',textContent:'Log the slip now',onclick:()=>{slip={when:'now',trigger:'',plan:'',note:''};go('slip')}}),
    h('button',{class:'link wide mt',textContent:'Back home',onclick:()=>go('home')})));
}

/* =========================================================
   SLIP — log it, learn one thing, keep going
   ========================================================= */
function rSlip(){
  const v=$('app');if(!slip)slip={when:'now',trigger:'',plan:'',note:''};
  const plan=h('input',{value:slip.plan,maxLength:120,placeholder:'e.g. leave the room and call '+who(),oninput:e=>slip.plan=e.target.value});
  fill(v,card(h('h2',{style:'font-size:19px',textContent:'It happened. That’s a slip, not the end.'}),
    h('p',{textContent:'Almost everyone slips. The people who make it are the ones who log it and carry on the same day.'}),
    h('label',{textContent:'When?'}),
    h('div',{class:'chips'},[['now','Just now'],['earlier','Earlier today'],['yesterday','Yesterday']].map(([k,l])=>h('button',{class:'chip'+(slip.when===k?' on':''),textContent:l,onclick:()=>{slip.when=k;render()}}))),
    h('label',{textContent:'What set it off?'}),
    h('div',{class:'chips'},TRIGGERS.map(t=>h('button',{class:'chip'+(slip.trigger===t?' on':''),textContent:t,onclick:()=>{slip.trigger=t;slip.plan=slip.plan||S.ifthen[t]||'';render()}}))),
    h('label',{textContent:slip.trigger?`Next time "${slip.trigger.toLowerCase()}" hits, I will…`:'Next time, I will…'}),plan,
    h('button',{class:'wide',style:'margin-top:18px',textContent:'Log it and keep going',onclick:()=>{
      const now=Date.now(),when=slip.when==='now'?now:slip.when==='earlier'?now-3*36e5:now-20*36e5;
      S.slips.push({when,trigger:slip.trigger});S.lastUse=Math.max(S.lastUse,when);S.checks[Math.floor(when/DAY)]='slip';
      if(slip.trigger&&slip.plan.trim())S.ifthen[slip.trigger]=slip.plan.trim();
      endCrave();screen='slipped';persist();scrollTo(0,0)}})));
}
function rSlipped(){
  const d=tbDay(),N=S.tb.days;
  fill($('app'),card(h('h2',{style:'font-size:19px',textContent:'Logged. The break is still on.'}),
    h('p',{class:'white',textContent:started()&&!S.tb.ended?`The clean clock restarted, but you’re still on day ${d}${S.tb.open?'':' of '+N}, with ${cleanDays()} clean days behind you. Those don’t disappear.`:'The clean clock has restarted.'}),
    h('p',{textContent:'Put everything away again now, drink some water, and do the next hour clean. That’s the whole job.'}),
    digits()?h('button',{class:'ghost wide mt',onclick:()=>native.whatsapp(digits(),`I slipped today. Getting straight back on it. Day ${d} of ${N}.`)},ic('send'),`Tell ${who()} (it helps)`):null,
    h('button',{class:'wide mt',textContent:'Back home',onclick:()=>go('home')})));
}

/* =========================================================
   MORE — tools and settings, out of the way
   ========================================================= */
const TOOLS=[['breathe','breathe','Breathe',tBreathe],['game','blocks','Blocks',tGame],['thoughts','thought','Talk back',tThoughts],['tape','forward','Play it forward',tTape],
  ['voice','headphones','Message from me',tVoice],['body','heart','Body recovery',tBody],['sleep','moon','Sleep without it',tSleep],['nic','notob','Nicotine help',tNic]];
function weeklyText(){const d=tbDay(),N=S.tb.days;
  return `ClearMind update from ${S.name}: day ${Math.min(d,S.tb.open?d:N)}${S.tb.open?'':' of '+N}. Clean days: ${cleanDays()}. Cravings beaten: ${S.wins.length}. Slips: ${S.slips.filter(x=>x.when>=S.tb.start).length}. Clean right now for ${lastUse()?dur(Date.now()-lastUse()):'—'}.`}
function rMore(){
  const v=$('app');
  if(sub){const t=TOOLS.find(x=>x[0]===sub);if(t){const b=h('div');fill(v,b);t[3](b,false);return}}
  if(sub==='weekly'){fill(v,card(h('h2',{textContent:`Weekly update for ${who()}`}),h('p',{class:'white',style:'font-family:var(--mono);font-size:14px',textContent:weeklyText()}),
    digits()?h('button',{class:'wide mt',onclick:()=>native.whatsapp(digits(),weeklyText())},ic('send'),'Send on WhatsApp'):h('p',{textContent:'Add your person’s number under My deal first.'}),
    h('button',{class:'ghost wide mt',textContent:'Share another way',onclick:()=>native.share(weeklyText())})));return}
  if(sub==='deal'){rDeal(v);return}
  if(sub==='history'){
    const rows=[...S.slips.map((x,i)=>({t:x.when,k:'slip',i,txt:'Slip'+(x.trigger?' · '+x.trigger:'')})),...S.wins.map((x,i)=>({t:x.when,k:'win',i,txt:'Craving beaten'+(x.round>1?' · round '+x.round:'')}))].sort((a,b)=>b.t-a.t).slice(0,120);
    fill(v,card(h('h2',{textContent:'History'}),rows.length?rows.map(r=>h('div',{class:'entry'},h('div',{},h('div',{style:r.k==='slip'?'color:var(--emberInk)':'',textContent:r.txt}),h('div',{class:'small',textContent:new Date(r.t).toLocaleString([], {weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})})),
      r.k==='slip'?h('button',{class:'ghost sm',textContent:'Delete',onclick:()=>{if(confirm('Delete this slip?')){S.slips.splice(r.i,1);S.lastUse=Math.max(0,...S.slips.map(s=>s.when))||S.lastUse;persist()}}}):null)):h('p',{textContent:'Nothing yet.'})));return}
  if(sub==='help'){const tel=(n,d,num)=>h('div',{class:'tel'},h('div',{},h('div',{textContent:n}),h('div',{class:'small',textContent:d})),h('button',{class:'ghost sm',onclick:()=>native.dial(num)},ic('phone'),num));
    fill(v,card(h('h2',{textContent:'Free help (India)'}),tel('Drug de-addiction helpline','Counselling and referral · 24×7','14446'),tel('Tobacco Quit Line','Free counselling to quit tobacco','1800112356'),tel('Tele-MANAS','Mental health support · 24×7','14416'),
      h('p',{class:'small mt',textContent:'An app is support, not treatment. If withdrawal is rough, or your mood drops badly, a doctor can help a lot, and it’s confidential. Many government hospitals run de-addiction clinics.'})));return}
  if(sub==='backup'){const ta=h('textarea',{rows:4,placeholder:'Paste a backup here to restore'});
    fill(v,card(h('h2',{textContent:'Backup'}),h('p',{textContent:'Everything lives only on this phone. Export sends a copy wherever you choose (your own WhatsApp, Drive, email).'}),
      h('button',{class:'wide',textContent:'Export backup',onclick:()=>native.share(JSON.stringify({app:'ClearMind',v:4,data:S}))}),h('div',{style:'height:14px'}),ta,
      h('button',{class:'ghost wide mt',textContent:'Restore from pasted backup',onclick:()=>{try{const d=JSON.parse(ta.value);if(!d||d.app!=='ClearMind'||!d.data)throw 0;if(!confirm('Replace everything on this phone with the backup?'))return;localStorage.setItem(KEY,JSON.stringify({...d.data,hasVoice:false}));load();go('home');toast('Restored.')}catch(e){toast('That isn’t a ClearMind backup.')}}})),
     card(h('h2',{textContent:'Start over'}),h('button',{class:'danger',textContent:'Erase everything',onclick:async()=>{if(confirm('Erase all ClearMind data on this phone?')&&confirm('Really erase everything?')){try{await blobSet('voice',null)}catch(e){}localStorage.removeItem(KEY);load();ob={step:0};save();render()}}})));return}
  const row=(i,l,d,fn)=>h('button',{class:'tool',style:'min-height:0;flex-direction:row;align-items:center;gap:12px;width:100%;margin:8px 0',onclick:fn},h('span',{style:'margin:0'},ic(i)),h('div',{},l,h('small',{style:'display:block',textContent:d})));
  fill(v,card(h('div',{class:'label',textContent:'Tools'}),h('div',{class:'tools mt'},TOOLS.map(([k,i,l])=>h('button',{class:'tool',style:'min-height:84px',onclick:()=>go('more',{sub:k})},h('span',{},ic(i)),l)))),
    row('send','Weekly update',`Send ${who()} your progress`,()=>go('more',{sub:'weekly'})),
    row('target','My deal','Length, reasons, risky times, your person',()=>go('more',{sub:'deal'})),
    row('calendar','History','Slips and cravings beaten',()=>go('more',{sub:'history'})),
    row('phone','Free helplines','Talk to a real person',()=>go('more',{sub:'help'})),
    row('jar','Backup','Export, restore, start over',()=>go('more',{sub:'backup'})),
    h('footer',{textContent:'ClearMind keeps everything on this phone. Nothing is sent anywhere unless you tap a send button.'}));
}
function rDeal(v){
  const d=clone({days:S.tb.days,reasons:S.reasons,risk:S.risk,person:S.person,spend:S.spend,theme:S.theme,name:S.name});
  const draw=()=>fill(v,card(h('h2',{textContent:'My deal'}),
    h('label',{textContent:'My name'}),h('input',{value:d.name,maxLength:30,oninput:e=>d.name=e.target.value.trim()}),
    h('label',{textContent:'T-break length (days)'}),h('input',{type:'number',inputMode:'numeric',min:1,max:365,value:d.days,oninput:e=>d.days=Math.min(365,Math.max(1,parseInt(e.target.value)||d.days))}),
    h('label',{textContent:'Why I’m doing this (one per line)'}),h('textarea',{rows:3,value:d.reasons.join('\n'),oninput:e=>d.reasons=e.target.value.split('\n').map(x=>x.trim()).filter(Boolean)}),
    h('label',{textContent:'Risky times (I’ll get a heads-up before each)'}),
    h('div',{class:'chips'},RISK_SLOTS.map(([t,l])=>h('button',{class:'chip'+(d.risk.includes(t)?' on':''),textContent:`${l} · ${t}`,onclick:()=>{d.risk=d.risk.includes(t)?d.risk.filter(x=>x!==t):[...d.risk,t].sort();draw()}}))),
    h('label',{textContent:'My person'}),h('input',{value:d.person.name,maxLength:30,placeholder:'Name',oninput:e=>d.person.name=e.target.value.trim()}),
    h('div',{style:'height:8px'}),h('input',{type:'tel',value:d.person.phone,maxLength:20,placeholder:'WhatsApp number',oninput:e=>d.person.phone=e.target.value.trim()}),
    h('label',{class:'check',style:'margin-top:12px'},h('input',{type:'checkbox',checked:d.person.updates,onchange:e=>d.person.updates=e.target.checked}),'Sunday reminder to send them an update'),
    h('label',{textContent:'Spend per day before the break'}),h('input',{type:'number',inputMode:'numeric',min:0,value:d.spend||'',oninput:e=>d.spend=Math.max(0,parseFloat(e.target.value)||0)}),
    h('label',{textContent:'Look'}),h('div',{class:'chips'},[['dark','Night'],['light','Day']].map(([k,l])=>h('button',{class:'chip'+(d.theme===k?' on':''),textContent:l,onclick:()=>{d.theme=k;draw()}}))),
    h('button',{class:'wide',style:'margin-top:18px',textContent:'Save',onclick:()=>{S.name=d.name||S.name;S.tb.days=d.days;S.reasons=d.reasons;S.risk=d.risk;S.person=d.person;S.spend=d.spend;S.theme=d.theme;native.askNotify();persist();toast('Saved.')}}),
    h('button',{class:'link wide mt',textContent:'Turn on notifications',onclick:()=>native.askNotify()})));
  draw();
}
function tNic(box){
  box.append(card(h('h2',{textContent:'Nicotine help'}),
    h('p',{textContent:'If you’ve been mixing tobacco, part of every craving is nicotine. It wears off fast, which is why the urge keeps coming back even when you’re already high.'}),
    h('ul',{class:'tidy'},['Nicotine gum or patches from a chemist take the edge off. Ask the pharmacist which strength fits how much you smoked.','Nicotine cravings are worst in the first 3 days and fade over 2 to 4 weeks.','Each one lasts only a few minutes. Gum, water, or a walk gets you through most of them.','Avoid chai or coffee in your usual smoking spot for the first week; the pairing is a strong trigger.'].map(x=>h('li',{textContent:x}))),
    h('button',{class:'ghost wide mt',onclick:()=>native.dial('1800112356')},ic('phone'),'Free Tobacco Quit Line 1800-11-2356')));
}

/* ---------- events from Android (notification taps and actions) ---------- */
function handleNative(){
  const ev=native.pull();if(!ev.length)return;let dest=null;
  for(const e of ev){
    if(e.type==='clean'){S.checks[Math.floor((e.at||Date.now())/DAY)]='clean'}
    if(e.type==='open')dest=e.value;
  }
  save();
  if(!S.onboarded){render();return}
  if(dest==='crave'){if(S.crave){screen='crave';render()}else startCrave()}
  else if(dest==='slip'){slip={when:'now',trigger:'',plan:'',note:''};go('slip')}
  else if(dest==='weekly')go('more',{sub:'weekly'})
  else render();
}
window.onNative=handleNative;

/* ---------- clock ---------- */
setInterval(()=>{if(ticker)try{ticker()}catch(e){}else if(subTick)try{subTick()}catch(e){}},500);
setInterval(()=>{if(screen==='home')render()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){handleNative();if(screen==='home'||screen==='crave')render()}});
load();save();render();handleNative();
if('serviceWorker' in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

</script>
