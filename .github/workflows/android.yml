name: Build ClearMind APK

# Builds the Android app on GitHub (no Android Studio needed) and attaches the
# APK to a release, so it can be installed straight from the phone.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bundle the fonts into the app
        run: |
          cd android/app/src/main/assets
          mkdir -p fonts
          base="https://cdn.jsdelivr.net/npm"
          dl() { curl -fsSL "$1" -o "$2" && echo "got $2" || echo "SKIPPED $2 (falls back to a system font)"; }
          dl "$base/@fontsource/dm-mono@5.0.20/files/dm-mono-latin-300-normal.woff2" fonts/dm-mono-300.woff2
          dl "$base/@fontsource/dm-mono@5.0.20/files/dm-mono-latin-400-normal.woff2" fonts/dm-mono-400.woff2
          dl "$base/@fontsource/dm-mono@5.0.20/files/dm-mono-latin-500-normal.woff2" fonts/dm-mono-500.woff2
          dl "$base/@fontsource/instrument-sans@5.0.4/files/instrument-sans-latin-400-normal.woff2" fonts/instrument-sans-400.woff2
          dl "$base/@fontsource/instrument-sans@5.0.4/files/instrument-sans-latin-500-normal.woff2" fonts/instrument-sans-500.woff2
          dl "$base/@fontsource/instrument-sans@5.0.4/files/instrument-sans-latin-600-normal.woff2" fonts/instrument-sans-600.woff2
          ls -la fonts/

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        id: apk
        run: |
          src=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$src" ClearMind-v4.0.${{ github.run_number }}.apk
          echo "path=ClearMind-v4.0.${{ github.run_number }}.apk" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ClearMind-APK
          path: ${{ steps.apk.outputs.path }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.${{ github.run_number }}
          name: ClearMind v4.0.${{ github.run_number }}
          body: |
            Install on your phone: tap the `.apk` below, allow installing from this source when Android asks.

            Installs over any earlier ClearMind build and keeps your data.
          files: ${{ steps.apk.outputs.path }}
